# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    container:
      image: multimokia/ddlc-mod-base:latest

    name: ci_build

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      SDL_AUDIODRIVER: dummy # handles ALSA issues

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2.2.1
        with:
          # Version range or exact version of a Python version to use, using SemVer's version range syntax.
          python-version: 2.7.18 # optional, default is 3.x

      # download base mas
      - name: Copy files over
        run: |
          cp -Rf Monika\ After\ Story/* /ddlcbase/

      # touch file for unstable so it doesn't raise exceptions for some things
      - name: exception skip for unstable
        run: touch ddlcbase/trb
        if: github.ref == 'refs/heads/unstable'

      # run sprite checkers
      - name: check sprites
        run: python tools/ghactions.py

      # distribute
      - name: rpy distribute
        run: |
          cd /renpy
          ./renpy.sh launcher distribute "../ddlcbase/" --package Mod

      # lint renpy
      - name: rpy lint
        run: |
          cd /renpy
          ./renpy.sh "../ddlcbase/" lint | grep -E -v "^$|Could not find image \(monika [0-9][^[:space:]]+ corresponding to attributes on say statement\.|'monika [0-9][^[:space:]]+' is not an image\.|The image named 'monika [0-9][^[:space:]]+ was not declared\."
